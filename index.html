
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LifeVault</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f5f8;--card:#fff;--text:#17171c;--muted:#7b7b8a;--line:#e6e6ee;--acc:#4f46e5;--on:#fff;--soft:#eeeefb;--danger:#dc3c42;--ok:#2e9e6b;--safe:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0f0f13;--card:#18181e;--text:#ececf2;--muted:#8d8d9c;--line:#272731;--acc:#8480ff;--on:#0f0f13;--soft:#22223a;--danger:#ff6b70;--ok:#4cc38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{height:var(--h,100dvh);max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:14px 18px 8px}
header h1{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;color:var(--muted);transition:background .15s}
.ib:hover,.ib:active{background:var(--soft);color:var(--text)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:4px 18px 90px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(6px + var(--safe))}
nav button{flex:1;padding:9px 4px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}
.quick{display:flex;gap:8px;margin:6px 0 14px}
.quick input{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none}
.quick input:focus{border-color:var(--acc)}
.quick button{width:46px;border-radius:14px;background:var(--acc);color:var(--on);font-size:22px;font-weight:600}
.sec{margin:16px 0 6px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.sec.warn{color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer;animation:in .18s ease}
.row+.row{border-top:1px solid var(--line)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;font-size:13px;transition:.15s}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.nt{flex:none;width:22px;text-align:center;color:var(--muted);margin-top:1px}
.rt{flex:1;min-width:0}
.tt{overflow-wrap:anywhere}
.dd{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.meta{flex:none;font-size:13px;color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums}
.row.done .tt{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;font-weight:600;text-align:center;margin-top:10px}
.btn.pri{background:var(--acc);color:var(--on)}
.btn.sec2{background:var(--soft)}
.btn.danger{color:var(--danger);background:none}
.link{color:var(--acc);font-weight:600}
#msgs{flex:1;overflow-y:auto;padding:6px 18px 10px;display:flex;flex-direction:column;gap:10px}
.m{max-width:90%;padding:10px 14px;border-radius:18px;overflow-wrap:anywhere;animation:in .18s ease}
.m.u{align-self:flex-end;background:var(--acc);color:var(--on);border-bottom-right-radius:6px;white-space:pre-wrap}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.m ul,.m ol{margin:2px 0 6px;padding-left:20px}
.m h4{margin:4px 0}
.m blockquote{margin:4px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.m a{color:var(--acc)}
.m code{background:var(--soft);padding:1px 5px;border-radius:6px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.code{margin:6px 0;border-radius:12px;background:var(--soft);overflow:hidden}
.code-h{display:flex;justify-content:space-between;padding:5px 10px;font-size:12px;color:var(--muted)}
.code-h button{color:var(--acc);font-size:12px}
.code pre{margin:0;padding:8px 12px;overflow-x:auto}.code pre code{background:none;padding:0}
.m.err{align-self:flex-start;background:var(--card);border:1px solid var(--danger)}
.m.err button{display:block;margin-top:6px;color:var(--acc);font-weight:600}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.chip{padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left}
.chip:hover{border-color:var(--acc)}
.usage{padding:0 18px 4px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.composer{display:flex;gap:8px;align-items:flex-end;padding:6px 14px 10px}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:44px;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);outline:none;line-height:1.4}
.composer textarea:focus{border-color:var(--acc)}
.send{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--on);font-size:20px;font-weight:700;flex:none}
.send:disabled{opacity:.35}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--card);border-right:1px solid var(--line);transform:translateX(-102%);transition:.22s;z-index:21;display:flex;flex-direction:column;padding:16px 12px}
.drawer.on{transform:none}
.drawer h3{margin:0 6px 12px}
.conv{display:flex;align-items:center;border-radius:12px}
.conv.on{background:var(--soft)}
.conv .t{flex:1;min-width:0;text-align:left;padding:10px 12px}
.conv .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv small{color:var(--muted)}
.conv .x{padding:8px 12px;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe));transform:translateY(105%);transition:.25s;z-index:31;max-width:720px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .sub{margin:0 0 12px;color:var(--muted)}
label.f{display:block;margin:12px 0 6px;font-size:13px;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.inp:focus{border-color:var(--acc)}
.two{display:flex;gap:10px}.two>div{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{border-color:var(--acc);color:var(--acc);background:var(--soft)}
.fab{position:absolute;right:18px;bottom:16px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--on);font-size:28px;box-shadow:0 8px 22px rgba(79,70,229,.35)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);padding:10px 16px;border-radius:99px;background:var(--text);color:var(--bg);z-index:50;transition:.25s;max-width:90%;font-size:14px}
#toast.on{transform:translate(-50%,0)}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;place-items:center;text-align:center;padding:28px}
#gate.on{display:grid}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r .8s linear infinite;margin:18px auto}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<style>
.quick-ai{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ai-action{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px;font-weight:700}
.voice-rec{position:fixed;inset:auto 18px 92px 18px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 15px 45px #0005;display:none}
.voice-rec.on{display:block}
.rem-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="hTitle"></h1>
    <button class="ib" id="btnHist" aria-label="chats" hidden>☰</button>
    <button class="ib" id="btnNewChat" aria-label="new chat" hidden>＋</button>
    <button class="ib" id="btnSet" aria-label="settings">⚙</button>
  </header>
  <main>
    <section class="view on" id="v-today">
      <div class="scroll"><div class="quick"><input id="quick" maxlength="200" enterkeyhint="done"><button id="quickAdd" aria-label="add">＋</button></div><div id="todayList"></div></div>
      <button class="fab" id="fabToday" aria-label="add">＋</button>
    </section>
    <section class="view" id="v-soon">
      <div class="scroll" id="soonList"></div>
      <button class="fab" id="fabSoon" aria-label="add">＋</button>
    </section>
    <section class="view" id="v-chat">
      <div id="msgs"></div>
      <div class="usage"><span id="usageTxt"></span><button class="link" id="usageBuy"></button></div>
      <div class="quick-ai">
  <button class="ai-action" id="btnVoice">🎙 Голос</button>
  <button class="ai-action" id="btnPhoto">📷 Фото</button>
</div>
<div class="composer"><textarea id="inp" rows="1" aria-label="message"></textarea><button class="send" id="btnSend" aria-label="send">↑</button></div>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
<div class="voice-rec" id="voiceRec"><b>🎙 Запись голосового</b><p id="voiceTimer">00:00</p><button class="btn pri" id="stopVoice">Остановить</button></div>
    </section>
  </main>
  <nav>
    <button id="nToday" class="on"><span>☀</span><i id="lToday" style="font-style:normal"></i></button>
    <button id="nSoon"><span>▦</span><i id="lSoon" style="font-style:normal"></i></button>
    <button id="nChat"><span>✦</span><i id="lChat" style="font-style:normal"></i></button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><h3 id="drTitle"></h3><div id="convs" style="flex:1;overflow-y:auto"></div></aside>
<div class="sheet" id="shEntry"></div>
<div class="sheet" id="shSet"></div>
<div class="sheet" id="shPro"></div>
<div id="toast" role="status"></div>
<div id="gate"><div><b style="font-size:24px">LifeVault</b><p id="gateTxt" style="color:var(--muted)"></p><div class="spin" id="gateSpin"></div></div></div>

<script>
// ====== НАСТРОЙКИ ======
// Адрес вашей функции в Supabase. Если она называется не "api", замените последнее слово.
const API_URL = 'https://jkkaxhidrqqnrbvxukbi.supabase.co/functions/v1/api';
// Нужен только если у функции включён "Verify JWT" (лучше его выключить). Можно оставить пустым.
const PUBLIC_KEY = '';
// =======================

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
const L = (((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || 'ru') + '').toLowerCase().startsWith('en') ? 'en' : 'ru';
const LOC = L === 'en' ? 'en-US' : 'ru-RU';

const T = {
  ru: {
    today:'Сегодня', soon:'Скоро', chat:'Ассистент', overdue:'Просрочено', nodate:'Без срока', tomorrow:'Завтра',
    quick:'Новая задача на сегодня', emptyT:'На сегодня всё свободно', emptyS:'Добавьте задачу или напишите ассистенту, что запланировать.',
    soonEmpty:'Ближайшие две недели пусты', task:'Задача', event:'Событие', note:'Заметка',
    newEntry:'Новая запись', editEntry:'Запись', title:'Название', details:'Подробности', date:'Дата', time:'Время',
    save:'Сохранить', del:'Удалить', confirmDel:'Удалить?', saved:'Сохранено',
    placeholder:'Напишите, что запланировать, или спросите о своих днях…', newChat:'Новый чат', chats:'Диалоги', noTitle:'Новый чат',
    s1:'Что у меня сегодня?', s2:'Запланируй на завтра в 10:00 созвон', s3:'Перенеси просроченное на сегодня',
    chatT:'Чем помочь?', chatS:'Я вижу ваш ежедневник и могу добавлять, переносить и отмечать дела. В боте также можно прислать текст, голос или фото.',
    copy:'Копировать', copied:'Скопировано', retry:'Повторить', close:'Закрыть',
    errAi:'Не удалось получить ответ от AI. Попробуй ещё раз через несколько секунд.', errRate:'Слишком много запросов. Подожди минуту.',
    errNet:'Нет соединения. Проверь интернет и попробуй снова.', errAuth:'Откройте приложение через Telegram.', errGen:'Что-то пошло не так. Попробуй ещё раз.', errDb:'База данных не готова: выполните SQL-файл в Supabase.', invalidPromo:'Неверный промокод.', promoReady:'Промокод активирован! Premium включён навсегда ⭐', promoNotReady:'Промокод пока недоступен: сначала выполни SQL-файл.', promoPlaceholder:'Промокод', promoBtn:'Активировать', forever:'Premium навсегда',
    diag:'Проверьте в Supabase: у функции выключен «Verify JWT» и её название совпадает с адресом ниже.',
    openTg:'Откройте приложение через Telegram, чтобы войти.', loading:'Загрузка…',
    used:'Сегодня', of:'из', buy:'Premium', settings:'Настройки', style:'Стиль ответов', brief:'Кратко', balanced:'Сбалансированно', detailed:'Подробно',
    custom:'Своя инструкция (необязательно)', customPh:'Например: отвечай коротко и по делу',
    proT:'LifeVault Premium', proS:'Больше возможностей ассистента на 30 дней', b1:'До 300 сообщений в день вместо бесплатного лимита', b2:'Поддержка развития LifeVault',
    buyBtn:(n)=>`Купить за ${n} ⭐`, voice:'Голос', photo:'Фото', reminder:'Напомнить за', reminderNone:'Без напоминания', reminder5:'5 минут', reminder15:'15 минут', reminder30:'30 минут', reminder60:'1 час', reminder1440:'1 день', startBot:'Отправьте текст, запишите голосовое для напоминания или войдите в Mini App', contact:'Написать мне', active:'Premium активен до', limitHit:'Бесплатный лимит на сегодня закончился',
    thanks:'Спасибо! Активируем Premium…', paid:'Premium активен'
  },
  en: {
    today:'Today', soon:'Upcoming', chat:'Assistant', overdue:'Overdue', nodate:'No date', tomorrow:'Tomorrow',
    quick:'New task for today', emptyT:'Nothing planned for today', emptyS:'Add a task or tell the assistant what to plan.',
    soonEmpty:'The next two weeks are empty', task:'Task', event:'Event', note:'Note',
    newEntry:'New entry', editEntry:'Entry', title:'Title', details:'Details', date:'Date', time:'Time',
    save:'Save', del:'Delete', confirmDel:'Delete?', saved:'Saved',
    placeholder:'Say what to plan, or ask about your days…', newChat:'New chat', chats:'Chats', noTitle:'New chat',
    s1:'What do I have today?', s2:'Schedule a call tomorrow at 10:00', s3:'Move overdue items to today',
    chatT:'How can I help?', chatS:'I can see your planner and add, move and complete items.',
    copy:'Copy', copied:'Copied', retry:'Retry', close:'Close',
    errAi:'Could not get a response from the AI. Please try again in a few seconds.', errRate:'Too many requests. Wait a minute.',
    errNet:'No connection. Check your internet and try again.', errAuth:'Please open the app from Telegram.', errGen:'Something went wrong. Please try again.', errDb:'Database is not ready: run the SQL file in Supabase.', invalidPromo:'Invalid promo code.', promoReady:'Promo activated! Premium is permanent ⭐', promoNotReady:'Promo is unavailable: run the SQL file first.', promoPlaceholder:'Promo code', promoBtn:'Activate', forever:'Premium forever',
    diag:'Check in Supabase: Verify JWT is off for the function and its name matches the address below.',
    openTg:'Open the app from Telegram to sign in.', loading:'Loading…',
    used:'Today', of:'of', buy:'Premium', settings:'Settings', style:'Answer style', brief:'Brief', balanced:'Balanced', detailed:'Detailed',
    custom:'Custom instruction (optional)', customPh:'e.g. keep answers short and practical',
    proT:'LifeVault Premium', proS:'More from your assistant for 30 days', b1:'Up to 300 messages a day instead of the free limit', b2:'Support LifeVault development',
    buyBtn:(n)=>`Buy for ${n} ⭐`, voice:'Voice', photo:'Photo', reminder:'Remind me', reminderNone:'No reminder', reminder5:'5 minutes', reminder15:'15 minutes', reminder30:'30 minutes', reminder60:'1 hour', reminder1440:'1 day', reminder:'Remind me', startBot:'Send text, record a voice message for a reminder, or open the Mini App', contact:'Contact me', active:'Premium active until', limitHit:'Your free daily limit is used up',
    thanks:'Thank you! Activating Premium…', paid:'Premium is active'
  }
};
const t = (k, ...a) => { const v = T[L][k]; return typeof v === 'function' ? v(...a) : v; };

const S = { tab: 'today', entries: [], convs: [], cur: null, msgs: [], busy: false, failed: null, status: null, settings: { style: 'balanced', custom_instruction: '' }, title: '' };

// ---------- утилиты ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = (s) => new Date(s + 'T12:00:00').toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long' });
let toastTimer;
function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200); }
function haptic(k) { try { tg.HapticFeedback.notificationOccurred(k || 'success'); } catch (e) {} }
function applyTheme() { document.documentElement.dataset.theme = (tg && tg.colorScheme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
applyTheme(); if (tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme);

class ApiError extends Error { constructor(code, status) { super(code); this.code = code; this.status = status; } }
async function api(action, body) {
  const headers = { 'Content-Type': 'application/json', 'x-telegram-init-data': (tg && tg.initData) || '' };
  if (PUBLIC_KEY) { headers.apikey = PUBLIC_KEY; headers.Authorization = 'Bearer ' + PUBLIC_KEY; }
  let r;
  try { r = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify({ action, ...(body || {}) }) }); }
  catch (e) { throw new ApiError('network', 0); }
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new ApiError(d.error || 'server_error', r.status);
  return d;
}
function errText(e) {
  const c = e && e.code;
  if (c === 'planner_not_ready') return t('errDb');
  if (c === 'invalid_promo') return t('invalidPromo');
  if (c === 'promo_not_ready') return t('promoNotReady');
  return c === 'network' ? t('errNet') : c === 'unauthorized' ? t('errAuth') : c === 'rate_limited' ? t('errRate') : c === 'ai_unavailable' ? t('errAi') : t('errGen') + (c && c !== 'server_error' ? ' (' + c + ')' : '');
}

// ---------- Markdown (HTML экранируется заранее) ----------
function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => { blocks.push({ lang, code: code.replace(/\n$/, '') }); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const line of s.split('\n')) {
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + m[1] + '</li>'); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + m[1] + '</li>'); continue; }
    close();
    if (/^\u0000\d+\u0000$/.test(line.trim())) out.push(line.trim());
    else if ((m = line.match(/^#{1,6}\s+(.*)/))) out.push('<h4>' + m[1] + '</h4>');
    else if ((m = line.match(/^&gt;\s?(.*)/))) out.push('<blockquote>' + m[1] + '</blockquote>');
    else if (line.trim()) out.push('<p>' + line + '</p>');
  }
  close();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => { const b = blocks[+i]; return '<div class="code"><div class="code-h"><span>' + (b.lang || 'code') + '</span><button data-copy>' + t('copy') + '</button></div><pre><code>' + b.code + '</code></pre></div>'; });
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-copy]'); if (!btn) return;
  const code = btn.closest('.code').querySelector('code').textContent;
  const done = () => { btn.textContent = t('copied'); setTimeout(() => (btn.textContent = t('copy')), 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done);
  else { const ta = document.createElement('textarea'); ta.value = code; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); done(); }
});

function renderMsgs(loading) {
  const box = $('msgs'); box.innerHTML = '';
  if (loading) { box.innerHTML = '<div class="spin"></div>'; return; }
  if (!S.msgs.length && !S.busy && !S.failed) {
    box.innerHTML = '<div class="empty" style="margin:auto"><b>' + t('chatT') + '</b>' + t('chatS') + '<div class="chips">' + [t('s1'), t('s2'), t('s3')].map((x) => '<button class="chip">' + esc(x) + '</button>').join('') + '</div></div>';
    box.querySelectorAll('.chip').forEach((b) => (b.onclick = () => send(b.textContent))); return;
  }
  S.msgs.forEach((m) => { const el = document.createElement('div'); if (m.role === 'user') { el.className = 'm u'; el.textContent = m.content; } else { el.className = 'm a'; el.innerHTML = md(m.content); } box.appendChild(el); });
  if (S.busy) { const el = document.createElement('div'); el.className = 'm a'; el.innerHTML = '<span class="typing" aria-label="loading"><i></i><i></i><i></i></span>'; box.appendChild(el); }
  if (S.failed) { const el = document.createElement('div'); el.className = 'm err'; el.innerHTML = esc(S.failed.text) + '<button>' + t('retry') + '</button>'; el.querySelector('button').onclick = retry; box.appendChild(el); }
  box.scrollTop = box.scrollHeight;
}
async function send(text, opts) {
  text = (text || '').trim(); const isRetry = opts && opts.retry;
  if (S.busy || (!text && !isRetry)) return;
  S.busy = true; S.failed = null; $('btnSend').disabled = true;
  if (!isRetry) S.msgs.push({ role: 'user', content: text });
  renderMsgs();
  const now = new Date(), client = { today: ymd(now), time: pad(now.getHours()) + ':' + pad(now.getMinutes()), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC' };
  try {
    if (!S.cur) { const c = (await api('ai.conversations.create', { title: text.replace(/\s+/g, ' ').slice(0, 60) })).conversation; S.cur = c.id; S.title = c.title; renderHeader(); }
    const r = await api('ai.send', isRetry ? { conversation_id: S.cur, retry: true, client } : { conversation_id: S.cur, message: text, client });
    S.msgs.push(r.message); loadConvs(); loadStatus();
    if (r.changes && r.changes.length) { haptic(); loadEntries(); }
  } catch (e) {
    if (e.code === 'quota_exceeded') { S.msgs.pop(); $('inp').value = text; openPro(t('limitHit')); loadStatus(); }
    else S.failed = { text: errText(e), mode: e.code === 'ai_unavailable' ? 'retry' : 'resend', msg: text };
  }
  S.busy = false; $('btnSend').disabled = false; renderMsgs();
}
function retry() { const f = S.failed; if (!f) return; if (f.mode === 'retry') send('', { retry: true }); else { S.msgs.pop(); send(f.msg); } }

let mediaRecorder = null, mediaChunks = [], voiceStarted = 0, voiceTimerInt = null;
$('btnVoice').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaChunks = []; mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size) mediaChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop()); clearInterval(voiceTimerInt); $('voiceRec').classList.remove('on');
      const blob = new Blob(mediaChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      const data = await new Promise(res => { const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
      try {
        const r=await api('media.process',{kind:'voice',mime:blob.type||'audio/webm',data});
        if (r.title) {
          $('inp').value = `${r.title}${r.due_date ? ` ${r.due_date}` : ''}${r.due_time ? ` ${r.due_time}` : ''}${r.reminder_minutes !== null && r.reminder_minutes !== undefined ? ` напомни за ${r.reminder_minutes} минут` : ''}`;
          doSend();
        } else toast('Не удалось понять голос');
      } catch(e){toast(errText(e));}
    };
    mediaRecorder.start(); voiceStarted=Date.now(); $('voiceRec').classList.add('on');
    voiceTimerInt=setInterval(()=>{const s=Math.floor((Date.now()-voiceStarted)/1000);$('voiceTimer').textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`},500);
  } catch(e){toast('Разреши доступ к микрофону');}
};

function showGate(msg, e) {
  $('gateSpin').style.display = 'none';
  $('gateTxt').innerHTML = esc(msg) + (e ? '<div style="margin-top:16px;font-size:12px;text-align:left;line-height:1.5">' + esc(t('diag')) + '<br><code style="word-break:break-all;color:var(--acc)">' + esc(API_URL) + '</code><br>' + esc('code: ' + (e.code || '?') + ', status: ' + (e.status || 0)) + '</div><button class="btn pri" onclick="location.reload()">' + t('retry') + '</button>' : '');
  $('gate').classList.add('on');
}
(async function init() {
  $('gateTxt').textContent = t('loading'); renderHeader();
  if (!tg || !tg.initData) { showGate(t('openTg')); return; }
  try { await api('me', { timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Berlin' }); } catch (e) { showGate(errText(e), e); return; }
  loadEntries(); loadStatus(); await loadConvs();
  api('ai.settings.get').then((s) => (S.settings = s)).catch(() => {});
})();
</script>
