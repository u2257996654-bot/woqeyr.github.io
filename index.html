const md=t=>E(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function vAI(){return`<div class="row sp"><h1>ИИ-помощник</h1><div><button class="s" id="hs">История</button> <button class="s" id="nc">Новый</button></div></div><div id="ml">${S.msgs.length?S.msgs.map(m=>`<div class="m ${m.role==="user"?"u":"a"}">${md(m.content)}</div>`).join(""):`<div class="card mu" style="text-align:center">Спроси про планы или попроси добавить дело.${S.aiOn?"":"<br><b>ИИ сейчас не активен</b>"}</div><div class="seg" style="flex-wrap:wrap">${["Что у меня сегодня?","Составь план на день","Добавь задачу: купить молоко завтра","Что я мог забыть?"].map(t=>`<b data-p="${t}">${t}</b>`).join("")}</div>`}</div>

async function send(txt){if(!txt)return;try{if(!S.cid)S.cid=(await api("ai.conversations.create",{title:txt.slice(0,40)})).conversation.id;S.msgs.push({role:"user",content:txt});S.msgs.push({role:"assistant",content:"…"});draw();window.scrollTo(0,1e5);const r=await api("ai.send",{conversation_id:S.cid,message:txt,client:{tz:TZ,today:TD(),time:new Date().toTimeString().slice(0,5)}});S.msgs[S.msgs.length-1]={role:"assistant",content:r.message.content+(r.changes?.length?"\n\n✓ "+r.changes.map(c=>c.title||c.type).join(", "):"")};if(r.changes?.length)loadE();hap("success")}catch(e){S.msgs.pop();fail(e)}draw();window.scrollTo(0,1e5)}
function bAI(){const i=$("#ai");const go=()=>{const t=i.value.trim();i.value="";send(t)};$("#as").onclick=go;i.onkeydown=e=>e.key==="Enter"&&go();document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>send(b.dataset.p));
 $("#nc").onclick=()=>{S.cid=null;S.msgs=[];draw()};$("#hs").onclick=async()=>{try{const L=(await api("ai.conversations.list")).items,s=sheet(`<h1 style="font-size:20px">История</h1>${L.map(c=>`<div class="row card" style="margin:0"><div class="g" data-c="${c.id}">${E(c.title||"Чат")}</div><span data-x="${c.id}" class="mu">удалить</span></div>`).join("")||'<div class="mu">Пока пусто</div>'}`);s.querySelectorAll("[data-c]").forEach(e=>e.onclick=async()=>{S.cid=e.dataset.c;S.msgs=(await api("ai.messages.list",{conversation_id:S.cid})).items;s.remove();draw()});s.querySelectorAll("[data-x]").forEach(e=>e.onclick=async()=>{await api("ai.conversations.delete",{id:e.dataset.x});if(S.cid===e.dataset.x){S.cid=null;S.msgs=[]}s.remove();draw()})}catch(e){fail(e)}};
 $("#ph").onclick=()=>$("#fi").click();$("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;const im=await createImageBitmap(f),k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);media("photo",cv.toDataURL("image/jpeg",.85).split(",")[1],"image/jpeg")};
 let rec;$("#mc").onclick=async()=>{if(rec){rec.stop();return}try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:rec.mimeType});rec=null;$("#mc").textContent="голос";const r=new FileReader();r.onload=()=>media("voice",r.result.split(",")[1],b.type.split(";")[0]||"audio/webm");r.readAsDataURL(b)};rec.start();$("#mc").textContent="стоп";toast("Говори… нажми ⏹")}catch{toast("Нет доступа к микрофону")}}}
async function media(kind,data,mime){toast("Разбираю…");try{const r=await api("media.process",{kind,data,mime});if(!r.title){toast("Ничего не нашёл");return}sheetE({kind:r.kind,title:r.title,details:r.details,due_date:r.due_date,due_time:r.due_time,reminder_minutes:r.reminder_minutes})}catch(e){fail(e)}}

function vProf(){const p=S.ps,pr=p.premium,u=tg.initDataUnsafe?.user||{},dn=S.E.filter(e=>e.done).length,lv=Math.floor(Math.sqrt(dn/2))+1;
 return`<h1>Профиль</h1><div class="card row"><div style="width:44px;height:44px;border-radius:50%;border:1px solid var(--ac);display:grid;place-items:center;color:var(--ac);font-size:18px">${E((u.first_name||"?")[0])}</div><div class="g"><b>${E(u.first_name||"Гость")}</b><div class="mu">Уровень ${lv} · выполнено ${dn} за 60 дней</div></div></div>

 <div class="card b"><b>Стиль ИИ</b><div class="seg">${[["brief","Кратко"],["balanced","Обычно"],["detailed","Подробно"]].map(([k,l])=>`<b data-s="${k}" class="${S.st.style===k?"on":""}">${l}</b>`).join("")}</div><textarea id="ci" rows="2" style="margin-top:10px" placeholder="Свои пожелания к ИИ">${E(S.st.custom_instruction||"")}</textarea><button id="si" style="margin-top:10px">Сохранить</button></div>
 <div class="card b"><b>Оформление</b><div class="seg">${[...Object.entries(BG).map(([k,v])=>[k,v[0]]),["auto","Авто"]].map(([k,l])=>`<b data-bg="${k}" class="${(localStorage.lvBg||"night")===k?"on":""}">${l}</b>`).join("")}</div><div class="sw">${ACC.map(c=>`<i data-ac="${c}" style="background:${c}" class="${(localStorage.lvAc||ACC[0])===c?"on":""}"></i>`).join("")}<input type="color" id="cc" value="${localStorage.lvAc||ACC[0]}" title="Свой цвет"></div></div>

 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.st.style=b.dataset.s;document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x===b))});
 q("#si",async()=>{try{await api("ai.settings.save",{style:S.st.style,custom_instruction:$("#ci").value,model:"auto"});toast("Сохранено ✓")}catch(e){fail(e)}});
 document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{localStorage.lvBg=b.dataset.bg;th();draw()});document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{localStorage.lvAc=b.dataset.ac;th();draw()});const cc=$("#cc");if(cc){cc.oninput=()=>{localStorage.lvAc=cc.value;th()};cc.onchange=()=>draw()}
 q("#adm",adminSheet);q("#sp",()=>{const L=sorted(S.E.filter(e=>e.due_date===TD())),t="📅 Мой план на сегодня:\n"+(L.map(e=>`${e.done?"✅":"☐"} ${e.due_time?e.due_time.slice(0,5)+" ":""}${e.title}`).join("\n")||"пока пусто");tg.openTelegramLink("https://t.me/share/url?url=%20&text="+encodeURIComponent(t))})}

(async()=>{if(!API){$("#sp0")?.remove();document.body.innerHTML='<p style="padding:40px;text-align:center">Открой приложение через бота (нужен адрес API).</p>';return}
