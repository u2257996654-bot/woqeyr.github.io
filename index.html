// ---------- Markdown (HTML экранируется заранее) ----------
function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => { blocks.push({ lang, code: code.replace(/\n$/, '') }); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const line of s.split('\n')) {
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + m[1] + '</li>'); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + m[1] + '</li>'); continue; }
    close();
    if (/^\u0000\d+\u0000$/.test(line.trim())) out.push(line.trim());
    else if ((m = line.match(/^#{1,6}\s+(.*)/))) out.push('<h4>' + m[1] + '</h4>');
    else if ((m = line.match(/^&gt;\s?(.*)/))) out.push('<blockquote>' + m[1] + '</blockquote>');
    else if (line.trim()) out.push('<p>' + line + '</p>');
  }
  close();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => { const b = blocks[+i]; return '<div class="code"><div class="code-h"><span>' + (b.lang || 'code') + '</span><button data-copy>' + t('copy') + '</button></div><pre><code>' + b.code + '</code></pre></div>'; });
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-copy]'); if (!btn) return;
  const code = btn.closest('.code').querySelector('code').textContent;
  const done = () => { btn.textContent = t('copied'); setTimeout(() => (btn.textContent = t('copy')), 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done);
  else { const ta = document.createElement('textarea'); ta.value = code; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); done(); }
});

  $('shMem').innerHTML='<h3>'+t('addMemory')+'</h3><div class=memory-form><input id=memTitle class=inp maxlength=120 placeholder="'+t('memoryTitle')+'"><textarea id=memContent class=inp rows=4 maxlength=2000 placeholder="'+t('memoryContent')+'"></textarea><select id=memCat class=inp><option value=general>general</option><option value=preference>preference</option><option value=person>person</option><option value=project>project</option><option value=goal>goal</option></select><button class=btn pri id=memSave>'+t('saveMemory')+'</button><button class=btn sec2 id=memBack>'+t('close')+'</button></div>';
  $('memBack').onclick=openMemories; $('memSave').onclick=async()=>{const title=$('memTitle').value.trim(),content=$('memContent').value.trim();if(!title||!content)return;try{await api('memories.save',{title,content,category:$('memCat').value});toast(t('saved'));openMemories()}catch(e){toast(errText(e))}}; closeLayers();openLayer($('shMem'));setTimeout(()=>$('memTitle').focus(),180);
}
async function exportMemories(){try{const r=await api('memories.export');const blob=new Blob([JSON.stringify(r.items||[],null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lifevault-memory.json';a.click();URL.revokeObjectURL(a.href)}catch(e){toast(errText(e))}}
async function wipeAccount(){if(!confirm(t('wipeConfirm')))return;try{await api('account.wipe');tg.close();}catch(e){toast(errText(e))}}
async function openHealth(){try{const r=await api('ai.health');$('shMore').innerHTML='<h3>'+t('health')+'</h3>'+r.providers.map(x=>'<div class=health><span><b>'+esc(x.provider_label)+'</b><br><small>'+esc(x.model)+'</small></span><span class='+(x.ok?'ok':'bad')+'>'+ (x.ok?'● OK '+x.latency_ms+'ms':'● ERROR')+'</span></div>').join('')+'<button class=btn sec2 onclick="openMore()">'+t('close')+'</button>';openLayer($('shMore'))}catch(e){toast(errText(e))}}
function openThemeSheet(){const cur=localStorage.getItem('lv_theme')||'auto';$('shMore').innerHTML='<h3>'+t('theme')+'</h3><p class=sub>Выберите оформление LifeVault</p><div class=theme-grid><button class=theme-choice '+(cur==='auto'?'on':'')+' id=thAuto>🌓<br>'+t('autoTheme')+'</button><button class=theme-choice '+(cur==='light'?'on':'')+' id=thLight>☀️<br>'+t('light')+'</button><button class=theme-choice '+(cur==='dark'?'on':'')+' id=thDark>🌙<br>'+t('dark')+'</button></div><button class=btn sec2 id=themeBack>'+t('close')+'</button>';['Auto','Light','Dark'].forEach(k=>{const b=$('th'+k);if(b)b.onclick=()=>{setThemeMode(k.toLowerCase());closeLayers()}});$('themeBack').onclick=closeLayers;closeLayers();openLayer($('shMore'))}
$('btnMore').onclick=openMore;

// ---------- настройки ----------
const _ru = () => !/^(en|uk)/i.test((window.Telegram && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user && Telegram.WebApp.initDataUnsafe.user.language_code) || 'ru');
const MODEL_LBL = () => (_ru() ? 'AI-модель' : 'AI model');
const MODEL_AUTO = () => (_ru() ? 'Автоматически (рекомендуется)' : 'Automatic (recommended)');
function modelOpts(models, cur) {
  const groups = {};
  models.forEach((m) => { (groups[m.provider_label] = groups[m.provider_label] || []).push(m); });
  return Object.keys(groups).map((g) => '<optgroup label=\"' + esc(g) + '\">' + groups[g].map((m) => '<option value=\"' + esc(m.id) + '\"' + (m.id === cur ? ' selected' : '') + '>' + esc(m.label) + '</option>').join('') + '</optgroup>').join('');
}
async function openSettings() {
  try { S.settings = await api('ai.settings.get'); } catch (e) {}
  let models = []; try { models = (await api('ai.models')).items || []; } catch (e) {}
  const s = S.settings; let style = s.style;
  $('shSet').innerHTML = '<h3>' + t('settings') + '</h3><label class="f">' + t('style') + '</label><div class="seg" id="styleSeg">' +
    ['brief', 'balanced', 'detailed'].map((k) => '<button data-k="' + k + '" class="' + (style === k ? 'on' : '') + '">' + t(k) + '</button>').join('') + '</div>' +
    '<label class="f" for="mdl">' + MODEL_LBL() + '</label><select id="mdl" class="inp"><option value="auto">' + MODEL_AUTO() + '</option>' + modelOpts(models, s.model) + '</select>' +
    '<label class="f" for="custom">' + t('custom') + '</label><textarea id="custom" class="inp" rows="3" maxlength="500" placeholder="' + esc(t('customPh')) + '">' + esc(s.custom_instruction || '') + '</textarea>' +
    '<button class="btn pri" id="setSave">' + t('save') + '</button><button class="btn sec2" id="setPro">' + t('proT') + '</button>';
  $('styleSeg').querySelectorAll('button').forEach((b) => (b.onclick = () => { style = b.dataset.k; $('styleSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); }));
  $('setSave').onclick = async () => { try { const model = $('mdl').value; await api('ai.settings.save', { style, custom_instruction: $('custom').value, model }); S.settings = { style, custom_instruction: $('custom').value, model }; toast(t('saved')); closeLayers(); } catch (e) { toast(errText(e)); } };
  $('setPro').onclick = () => openPro();
  closeLayers(); openLayer($('shSet'));
}
$('btnSet').onclick = openSettings;

// ---------- диалоги ----------
async function loadConvs() { try { S.convs = (await api('ai.conversations.list')).items; } catch (e) { S.convs = []; } }
function renderConvs() {
  const box = $('convs'); box.innerHTML = '';
  S.convs.forEach((c) => {
    const el = document.createElement('div'); el.className = 'conv' + (c.id === S.cur ? ' on' : '');
    el.innerHTML = '<button class="t"><div>' + esc(c.title || t('noTitle')) + '</div><small>' + new Date(c.updated_at).toLocaleDateString(LOC) + '</small></button><button class="x" aria-label="delete">✕</button>';
    el.querySelector('.t').onclick = () => { openConv(c.id); closeLayers(); };
    el.querySelector('.x').onclick = async () => { if (!confirm(t('confirmDel'))) return; try { await api('ai.conversations.delete', { id: c.id }); } catch (e) { toast(errText(e)); return; } if (S.cur === c.id) newChat(); await loadConvs(); renderConvs(); };
    box.appendChild(el);
  });
}
async function openConv(id) {
  S.cur = id; S.failed = null; S.msgs = []; const c = S.convs.find((x) => x.id === id); S.title = c ? c.title : ''; renderHeader(); renderMsgs(true);
  try { S.msgs = (await api('ai.messages.list', { conversation_id: id })).items; } catch (e) { toast(errText(e)); }
  renderMsgs();
}
function newChat() { S.cur = null; S.msgs = []; S.failed = null; S.title = ''; renderHeader(); renderMsgs(); closeLayers(); }
$('btnNewChat').onclick = newChat; $('btnHist').onclick = () => { renderConvs(); openLayer($('drawer')); };

// ---------- чат ----------
function renderMsgs(loading) {
  const box = $('msgs'); box.innerHTML = '';
  if (loading) { box.innerHTML = '<div class="spin"></div>'; return; }
  if (!S.msgs.length && !S.busy && !S.failed) {
    box.innerHTML = '<div class="empty" style="margin:auto"><b>' + t('chatT') + '</b>' + t('chatS') + '<div class="chips">' + [t('s1'), t('s2'), t('s3')].map((x) => '<button class="chip">' + esc(x) + '</button>').join('') + '</div></div>';
    box.querySelectorAll('.chip').forEach((b) => (b.onclick = () => send(b.textContent))); return;
  }
  S.msgs.forEach((m) => { const el = document.createElement('div'); if (m.role === 'user') { el.className = 'm u'; el.textContent = m.content; } else { el.className = 'm a'; el.innerHTML = md(m.content); } box.appendChild(el); });
  if (S.busy) { const el = document.createElement('div'); el.className = 'm a'; el.innerHTML = '<span class="typing" aria-label="loading"><i></i><i></i><i></i></span>'; box.appendChild(el); }
  if (S.failed) { const el = document.createElement('div'); el.className = 'm err'; el.innerHTML = esc(S.failed.text) + '<button>' + t('retry') + '</button>'; el.querySelector('button').onclick = retry; box.appendChild(el); }
  box.scrollTop = box.scrollHeight;
}
async function send(text, opts) {
  text = (text || '').trim(); const isRetry = opts && opts.retry;
  if (S.busy || (!text && !isRetry)) return;
  S.busy = true; S.failed = null; $('btnSend').disabled = true;
  if (!isRetry) S.msgs.push({ role: 'user', content: text });
  renderMsgs();
  const now = new Date(), client = { today: ymd(now), time: pad(now.getHours()) + ':' + pad(now.getMinutes()), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC' };
  try {
    if (!S.cur) { const c = (await api('ai.conversations.create', { title: text.replace(/\s+/g, ' ').slice(0, 60) })).conversation; S.cur = c.id; S.title = c.title; renderHeader(); }
    const r = await api('ai.send', isRetry ? { conversation_id: S.cur, retry: true, client } : { conversation_id: S.cur, message: text, client });
    S.msgs.push(r.message); loadConvs(); loadStatus();
    if (r.changes && r.changes.length) { haptic(); loadEntries(); }
  } catch (e) {
    if (e.code === 'quota_exceeded') { S.msgs.pop(); $('inp').value = text; openPro(t('limitHit')); loadStatus(); }
    else S.failed = { text: errText(e), mode: e.code === 'ai_unavailable' ? 'retry' : 'resend', msg: text };
  }
  S.busy = false; $('btnSend').disabled = false; renderMsgs();
}
function retry() { const f = S.failed; if (!f) return; if (f.mode === 'retry') send('', { retry: true }); else { S.msgs.pop(); send(f.msg); } }
const inp = $('inp');
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 140) + 'px'; });
inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); doSend(); } });
function doSend() { const v = inp.value; if (!v.trim()) return; inp.value = ''; inp.style.height = 'auto'; send(v); }
$('btnSend').onclick = doSend;

// ---------- клавиатура на телефоне ----------
function fitHeight() { document.documentElement.style.setProperty('--h', ((window.visualViewport && window.visualViewport.height) || window.innerHeight) + 'px'); }
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { fitHeight(); const m = $('msgs'); m.scrollTop = m.scrollHeight; });
fitHeight();


// ---------- Голос / фото ----------
let mediaRecorder = null, mediaChunks = [], voiceStarted = 0, voiceTimerInt = null;
$('btnVoice').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaChunks = []; mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size) mediaChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop()); clearInterval(voiceTimerInt); $('voiceRec').classList.remove('on');
      const blob = new Blob(mediaChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      const data = await new Promise(res => { const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
      try {
        const r=await api('media.process',{kind:'voice',mime:blob.type||'audio/webm',data});
        if (r.title) {
          $('inp').value = `${r.title}${r.due_date ? ` ${r.due_date}` : ''}${r.due_time ? ` ${r.due_time}` : ''}${r.reminder_minutes !== null && r.reminder_minutes !== undefined ? ` напомни за ${r.reminder_minutes} минут` : ''}`;
          doSend();
        } else toast('Не удалось понять голос');
      } catch(e){toast(errText(e));}
    };
    mediaRecorder.start(); voiceStarted=Date.now(); $('voiceRec').classList.add('on');
    voiceTimerInt=setInterval(()=>{const s=Math.floor((Date.now()-voiceStarted)/1000);$('voiceTimer').textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`},500);
  } catch(e){toast('Разреши доступ к микрофону');}
};
$('stopVoice').onclick = () => { if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); };
$('btnPhoto').onclick = () => $('photoInput').click();
$('photoInput').onchange = async () => {
  const f=$('photoInput').files?.[0]; if(!f) return;
  try {
    const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.readAsDataURL(f)});
    const r=await api('media.process',{kind:'photo',mime:f.type||'image/jpeg',data});
    if(r.title){
      $('inp').value=`${r.title}${r.due_date?` ${r.due_date}`:''}${r.due_time?` ${r.due_time}`:''}`;
      doSend();
    } else toast('На фото не найдено событие');
  } catch(e){toast(errText(e));}
};

async function showDiagnostics(){const body=$('diagBody');body.innerHTML='<div class="diagline"><span>Mini App</span><b>'+((tg&&tg.initData)?'<span class="diagok">OK</span>':'<span class="diagbad">Откройте через Telegram</span>')+'</b></div><div class="diagline"><span>Supabase API</span><b id="diagApi">Проверка…</b></div><div class="diagline"><span>Endpoint</span><small style="max-width:220px;word-break:break-all">'+esc(API_URL)+'</small></div><div class="diagline"><span>Версия</span><b>'+APP_VERSION+'</b></div>';try{await healthCheck();$('diagApi').innerHTML='<span class="diagok">ДОСТУПЕН</span>'}catch(e){$('diagApi').innerHTML='<span class="diagbad">НЕДОСТУПЕН</span><br><small>'+esc(e.code||'network')+'</small>'}closeLayers();openLayer($('diag'))}
$('diagRetry').onclick=showDiagnostics;$('diagClose').onclick=closeLayers;$('btnDiag').onclick=showDiagnostics;

// ---------- старт ----------
function showGate(msg, e) {
  $('gateSpin').style.display = 'none';
  $('gateTxt').innerHTML = esc(msg) + (e ? '<div style="margin-top:16px;font-size:12px;text-align:left;line-height:1.5">' + esc(t('diag')) + '<br><code style="word-break:break-all;color:var(--acc)">' + esc(API_URL) + '</code><br>' + esc('code: ' + (e.code || '?') + ', status: ' + (e.status || 0)) + '</div><button class="btn pri" onclick="location.reload()">' + t('retry') + '</button>' : '');
  $('gate').classList.add('on');
}
(async function init() {
  $('gateTxt').textContent = t('loading'); renderHeader();
  if (!tg || !tg.initData) { showGate(t('openTg')); return; }
  try { await api('me', { timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Berlin' }); } catch (e) { showGate(errText(e), e); return; }
  loadEntries(); loadStatus(); await loadConvs();
  api('ai.settings.get').then((s) => (S.settings = s)).catch(() => {});
})();
</script>
