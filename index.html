<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LifeVault</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090b12;--c:#131726;--c2:#1b2036;--ln:#262d48;--tx:#eef1fb;--mu:#8a92b5;--ac:#7c8cff;--ok:#3ddc97;--bad:#ff6b7a;--r:20px}
:root.l{--bg:#f2f3fa;--c:#fff;--c2:#eceefa;--ln:#dde0f2;--tx:#161a2b;--mu:#6a7291}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font:15px/1.45 -apple-system,Inter,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 380px at 90% -5%,color-mix(in srgb,var(--ac) 35%,transparent),transparent),radial-gradient(500px 360px at -10% 30%,rgba(176,124,255,.18),transparent);pointer-events:none}
#v{position:relative;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0;letter-spacing:-.5px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{flex:1}
input,textarea,select{width:100%;background:var(--c2);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--ac)}
button{font:inherit;font-weight:650;border:0;border-radius:14px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--ac),#b07cff);cursor:pointer}button:active{transform:scale(.97)}
button.s{background:var(--c2);color:var(--tx);border:1px solid var(--ln)}button.x{background:none;color:var(--bad);padding:6px}
.seg{display:flex;gap:6px;overflow:auto;margin-top:12px}.seg b{flex:none;padding:8px 14px;border-radius:99px;background:var(--c);border:1px solid var(--ln);font-weight:600;font-size:13px;cursor:pointer}.seg b.on{background:var(--ac);border-color:var(--ac);color:#fff}
.it{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--ln)}.it:first-child{border-top:0}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--mu);flex:none;display:grid;place-items:center;color:#fff;font-size:15px}.it.d .ck{background:var(--ok);border-color:var(--ok)}.it.d .t{text-decoration:line-through;opacity:.5}
.t{font-weight:600}.h{margin:18px 4px 0;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu)}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--c2);font-size:12px;font-weight:600;margin-right:6px}
.ring{width:84px;height:84px;flex:none}.ring text{fill:var(--tx);font-weight:800;font-size:20px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:8px;border-radius:26px;background:color-mix(in srgb,var(--c) 85%,transparent);backdrop-filter:blur(18px);border:1px solid var(--ln);box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:5}
nav i{font-style:normal;width:56px;text-align:center;padding:8px 0;border-radius:18px;font-size:20px;color:var(--mu);cursor:pointer}nav i small{display:block;font-size:10px;font-weight:600}nav i.on{background:var(--ac);color:#fff}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:flex;align-items:flex-end}.sh>div{width:100%;max-width:560px;margin:0 auto;background:var(--c);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:grid;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}.cal span{padding:8px 0;border-radius:12px;font-weight:600;position:relative;cursor:pointer}.cal span.o{opacity:.25}.cal span.n{outline:1px solid var(--ac)}.cal span.on{background:var(--ac);color:#fff}.cal span.k:after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.m{max-width:85%;padding:10px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;word-break:break-word}.m.u{margin-left:auto;background:var(--ac);color:#fff;border-bottom-right-radius:6px}.m.a{background:var(--c);border:1px solid var(--ln);border-bottom-left-radius:6px}
.bar{height:8px;border-radius:9px;background:var(--c2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#b07cff)}
.sw i{display:inline-block;width:30px;height:30px;border-radius:50%;margin-right:8px;border:3px solid transparent;cursor:pointer}.sw i.on{border-color:var(--tx)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-80px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;z-index:20;transition:.25s}#toast.s{transform:translate(-50%,0)}
.cf{position:fixed;top:-20px;font-size:22px;z-index:30;animation:fall 1.8s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
</style></head><body><div id="v"></div><div id="toast"></div>
<nav id="nav"></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const API=new URLSearchParams(location.search).get("api")||localStorage.lvApi||"";if(API)localStorage.lvApi=API;
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone,$=(s,r=document)=>r.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ERR={quota_exceeded:"Лимит ИИ на сегодня исчерпан",ai_disabled:"ИИ временно отключён",ai_unavailable:"ИИ недоступен, попробуй позже",ai_nokey:"ИИ не настроен",planner_not_ready:"База не готова (SQL)",invalid_promo:"Неверный промокод",rate_limited:"Слишком часто, подожди",limit_reached:"Достигнут лимит",unauthorized:"Открой приложение из Telegram"};
async function api(a,b={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-telegram-init-data":tg.initData||""},body:JSON.stringify({action:a,timezone:TZ,...b})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"server_error");return j}
const toast=t=>{const e=$("#toast");e.textContent=t;e.className="s";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",2200)};
const hap=k=>{try{tg.HapticFeedback.notificationOccurred(k)}catch{}};
const fail=e=>{toast(ERR[e.message]||"Ошибка: "+e.message);hap("error")};
const fd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),pd=s=>new Date(s+"T12:00:00"),add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fd(d)},TD=()=>fd(new Date());
const DAYS=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"],MON=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const S={tab:"today",f:"all",E:[],cal:fd(new Date()).slice(0,7),sel:TD(),cid:null,msgs:[],mem:[],ps:{},st:{style:"balanced",custom_instruction:""},aiOn:true};
const ACC=["#7c8cff","#ff7ab6","#3ddc97","#ffb454","#4cc9f0"];
const th=()=>{const t=localStorage.lvTheme||"dark",l=t==="light"||(t==="auto"&&tg.colorScheme==="light");document.documentElement.classList.toggle("l",l);document.documentElement.style.setProperty("--ac",localStorage.lvAc||ACC[0])};th();
const KI={task:"✅",event:"📅",note:"📝"};
// --- быстрый разбор «завтра в 10 созвон»
function parseQ(t){let s=" "+t+" ",d=null,tm=null,k="task",n=new Date(),m;
 const cut=r=>{m=s.match(r);if(m)s=s.replace(m[0]," ");return m};
 if(cut(/\sпосле\s?завтра(?=\s)/i))d=add(TD(),2);else if(cut(/\sзавтра(?=\s)/i))d=add(TD(),1);else if(cut(/\sсегодня(?=\s)/i))d=TD();
 else if(cut(/\sчерез\s+(\d+)\s*(мин|час|ч|дн|день|дня|дней)\S*/i)){const v=+m[1],u=m[2];const x=new Date();if(/^мин/.test(u))x.setMinutes(x.getMinutes()+v);else if(/^ч/.test(u))x.setHours(x.getHours()+v);else x.setDate(x.getDate()+v);d=fd(x);if(!/^д/.test(u))tm=String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0")}
 else if(cut(/\s(?:в\s+)?(пн|вт|ср|чт|пт|сб|вс)\S*(?=\s)/i)){const i=["вс","пн","вт","ср","чт","пт","сб"].indexOf(m[1].toLowerCase());let x=(i-n.getDay()+7)%7||7;d=add(TD(),x)}
 if(cut(/\s(?:в\s+)?(\d{1,2})[:.](\d{2})(?=\s)/)||cut(/\sв\s+(\d{1,2})(?=\s)/))tm=String(Math.min(+m[1],23)).padStart(2,"0")+":"+(m[2]||"00");
 s=s.trim();if(/^(заметка|!)[:\s]/i.test(s)){k="note";s=s.replace(/^(заметка|!)[:\s]*/i,"")}else if(/встреч|созвон|концерт|событи|день рожд|врач/i.test(s))k="event";
 return{kind:k,title:s.charAt(0).toUpperCase()+s.slice(1),due_date:d,due_time:tm}}
async function loadE(){try{S.E=(await api("entries.list",{from:add(TD(),-60),to:add(TD(),30)})).items}catch(e){fail(e)}}
const sorted=a=>[...a].sort((x,y)=>(x.due_time||"")<(y.due_time||"")?-1:1);
function streak(){const ds=new Set(S.E.filter(e=>e.done&&e.due_date).map(e=>e.due_date));let n=0,d=ds.has(TD())?TD():add(TD(),-1);while(ds.has(d)){n++;d=add(d,-1)}return n}
function boom(){for(let i=0;i<36;i++){const e=document.createElement("div");e.className="cf";e.textContent=["🎉","✨","⭐","🔥"][i%4];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.5+"s";document.body.append(e);setTimeout(()=>e.remove(),2500)}hap("success")}
function item(e){const late=!e.done&&e.due_date&&e.due_date<TD()&&e.kind!=="note";return`<div class="it ${e.done?"d":""}" data-id="${e.id}"><div class="ck" data-t="${e.id}">${e.done?"✓":""}</div><div class="g" data-e="${e.id}"><div class="t">${KI[e.kind]||""} ${E(e.title)}</div><div class="mu">${late?"⚠️ "+e.due_date.slice(5).split("-").reverse().join(".")+" ":""}${e.due_time?e.due_time.slice(0,5):""}${e.reminder_minutes!=null?" 🔔":""}${e.details?" · "+E(e.details.slice(0,40)):""}</div></div>${e.kind==="task"&&!e.done?`<span data-f="${e.id}" style="font-size:20px;cursor:pointer">⏱</span>`:""}</div>`}
const flt=a=>a.filter(e=>S.f==="all"||e.kind===S.f);
function vToday(){const t=TD(),A=flt(S.E),td=A.filter(e=>e.due_date===t),late=A.filter(e=>!e.done&&e.due_date&&e.due_date<t&&e.kind!=="note"),soon=A.filter(e=>e.due_date>t&&e.due_date<=add(t,7)),nod=A.filter(e=>!e.due_date),dn=td.filter(e=>e.done).length,p=td.length?dn/td.length:0,h=new Date().getHours(),u=tg.initDataUnsafe?.user?.first_name||"";
 const sec=(n,l)=>l.length?`<div class="h">${n}</div><div class="card" style="margin-top:6px;padding:4px 12px">${sorted(l).map(item).join("")}</div>`:"";
 return`<div class="row sp"><div><div class="mu">${DAYS[new Date().getDay()]}, ${new Date().getDate()} ${MON[new Date().getMonth()].toLowerCase()}</div><h1>${h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер"}${u?", "+E(u):""}</h1></div></div>
 <div class="card row"><svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--c2)" stroke-width="9"/><circle cx="42" cy="42" r="36" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${226*p} 226" transform="rotate(-90 42 42)"/><text x="42" y="49" text-anchor="middle">${Math.round(p*100)}%</text></svg><div class="g"><b>${td.length?`${dn} из ${td.length} на сегодня`:"День свободен"}</b><div style="margin-top:6px"><span class="chip">🔥 серия ${streak()}</span><span class="chip">⚡ ИИ ${S.ps.used_today??0}/${S.ps.limit_today??"–"}</span></div></div></div>
 <div class="card row"><input id="q" class="g" placeholder="Завтра в 10 созвон…" enterkeyhint="send"><button id="qa">＋</button></div><div class="mu" id="qp" style="margin:6px 6px 0"></div>
 <div class="seg">${[["all","Все"],["task","Задачи"],["event","События"],["note","Заметки"]].map(([k,l])=>`<b data-k="${k}" class="${S.f===k?"on":""}">${l}</b>`).join("")}</div>
 ${sec("⚠️ Просрочено",late)}${sec("Сегодня",td)}${sec("Скоро",soon)}${sec("Без даты",nod)}${A.length?"":'<div class="card mu" style="text-align:center">Пока пусто — напиши дело строкой выше ✨</div>'}`}
function bToday(){const q=$("#q");q.oninput=()=>{const p=parseQ(q.value);$("#qp").textContent=q.value&&p.title?`${KI[p.kind]} ${p.title}${p.due_date?" · 📅 "+p.due_date.slice(5).split("-").reverse().join("."):""}${p.due_time?" ⏰ "+p.due_time:""}`:""};
 const go=async()=>{const p=parseQ(q.value);if(!p.title)return;try{await api("entries.save",{...p,reminder_minutes:p.due_time?15:null});hap("success");await loadE();draw()}catch(e){fail(e)}};$("#qa").onclick=go;q.onkeydown=e=>e.key==="Enter"&&go();
 document.querySelectorAll(".seg b").forEach(b=>b.onclick=()=>{S.f=b.dataset.k;draw()});wireItems()}
function wireItems(){document.querySelectorAll("[data-t]").forEach(c=>c.onclick=async()=>{const e=S.E.find(x=>x.id===c.dataset.t),was=S.E.filter(x=>x.due_date===TD()&&!x.done).length;e.done=!e.done;try{await api("entries.toggle",{id:e.id,done:e.done});hap("success");if(e.done&&e.due_date===TD()&&was===1)boom();draw()}catch(x){e.done=!e.done;fail(x)}});
 document.querySelectorAll("[data-e]").forEach(c=>c.onclick=()=>sheetE(S.E.find(x=>x.id===c.dataset.e)));document.querySelectorAll("[data-f]").forEach(c=>c.onclick=()=>focus(S.E.find(x=>x.id===c.dataset.f)))}
function sheet(h){const s=document.createElement("div");s.className="sh";s.innerHTML=`<div>${h}</div>`;s.onclick=e=>{if(e.target===s)s.remove()};document.body.append(s);return s}
function sheetE(e,date){e=e||{kind:"task",due_date:date||null};const s=sheet(`<h1 style="font-size:20px">${e.id?"Редактировать":"Новая запись"}</h1><div class="seg" id="kk">${Object.keys(KI).map(k=>`<b data-k="${k}" class="${e.kind===k?"on":""}">${KI[k]} ${{task:"Задача",event:"Событие",note:"Заметка"}[k]}</b>`).join("")}</div><input id="et" placeholder="Название" value="${E(e.title||"")}"><textarea id="ed" rows="3" placeholder="Детали">${E(e.details||"")}</textarea><div class="row"><input id="dd" type="date" value="${e.due_date||""}"><input id="dt" type="time" value="${(e.due_time||"").slice(0,5)}"></div><select id="rm">${[["","Без напоминания"],[0,"В момент"],[5,"За 5 минут"],[15,"За 15 минут"],[60,"За час"],[1440,"За день"]].map(([v,l])=>`<option value="${v}" ${String(e.reminder_minutes??"")===String(v)?"selected":""}>${l}</option>`).join("")}</select><button id="sv">Сохранить</button>${e.id?'<button class="x" id="dl">Удалить</button>':""}`);let k=e.kind;
 s.querySelectorAll("#kk b").forEach(b=>b.onclick=()=>{k=b.dataset.k;s.querySelectorAll("#kk b").forEach(x=>x.classList.toggle("on",x===b))});
 $("#sv",s).onclick=async()=>{try{await api("entries.save",{id:e.id,kind:k,title:$("#et",s).value,details:$("#ed",s).value,due_date:$("#dd",s).value||null,due_time:$("#dt",s).value||null,reminder_minutes:$("#rm",s).value===""?null:+$("#rm",s).value});s.remove();hap("success");await loadE();draw()}catch(x){fail(x)}};
 if(e.id)$("#dl",s).onclick=async()=>{try{await api("entries.delete",{id:e.id});s.remove();await loadE();draw()}catch(x){fail(x)}}}
function focus(e){let mode=25,end=0,left=25*60,tm;const s=sheet(`<div style="text-align:center"><div class="mu">Фокус · ${E(e.title)}</div><h1 id="fc" style="font-size:64px;margin:14px 0">25:00</h1><div class="seg" style="justify-content:center">${[25,5,15].map(m=>`<b data-m="${m}" class="${m===25?"on":""}">${m} мин</b>`).join("")}</div><div class="row" style="margin-top:14px"><button class="g" id="fs">Старт</button><button class="s g" id="fd">Готово ✓</button></div></div>`);
 const show=()=>$("#fc",s).textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
 s.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=+b.dataset.m;left=mode*60;clearInterval(tm);end=0;$("#fs",s).textContent="Старт";s.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x===b));show()});
 $("#fs",s).onclick=()=>{if(end){left=Math.max(0,Math.round((end-Date.now())/1e3));end=0;clearInterval(tm);$("#fs",s).textContent="Продолжить";return}end=Date.now()+left*1e3;$("#fs",s).textContent="Пауза";tm=setInterval(()=>{left=Math.max(0,Math.round((end-Date.now())/1e3));show();if(!left){clearInterval(tm);end=0;hap("success");toast("Время вышло! 🎉");$("#fs",s).textContent="Старт";left=mode*60}},500)};
 $("#fd",s).onclick=async()=>{clearInterval(tm);try{await api("entries.toggle",{id:e.id,done:true});e.done=true}catch(x){fail(x)}s.remove();draw()};new MutationObserver(()=>{if(!document.body.contains(s))clearInterval(tm)}).observe(document.body,{childList:true})}
// --- календарь
function vCal(){const[y,m]=S.cal.split("-").map(Number),first=new Date(y,m-1,1),off=(first.getDay()+6)%7,dim=new Date(y,m,0).getDate(),has=new Set(S.E.map(e=>e.due_date));let c="";for(const w of["Пн","Вт","Ср","Чт","Пт","Сб","Вс"])c+=`<span class="mu" style="cursor:default">${w}</span>`;for(let i=0;i<off;i++)c+="<span></span>";for(let d=1;d<=dim;d++){const ds=S.cal+"-"+String(d).padStart(2,"0");c+=`<span data-d="${ds}" class="${ds===S.sel?"on":""} ${ds===TD()?"n":""} ${has.has(ds)?"k":""}">${d}</span>`}
 const L=S.E.filter(e=>e.due_date===S.sel);return`<div class="row sp"><button class="s" id="pm">‹</button><h1 style="font-size:20px">${MON[m-1]} ${y}</h1><button class="s" id="nm">›</button></div><div class="card"><div class="cal">${c}</div></div><div class="row sp"><div class="h">${S.sel.split("-").reverse().join(".")}</div><button class="s" id="ad" style="padding:6px 12px;margin-top:14px">＋ Добавить</button></div><div class="card" style="margin-top:6px;padding:4px 12px">${L.length?sorted(L).map(item).join(""):'<div class="mu" style="padding:14px;text-align:center">В этот день пусто</div>'}</div>`}
function bCal(){const sh=n=>{const[y,m]=S.cal.split("-").map(Number),d=new Date(y,m-1+n,1);S.cal=fd(d).slice(0,7);draw()};$("#pm").onclick=()=>sh(-1);$("#nm").onclick=()=>sh(1);document.querySelectorAll("[data-d]").forEach(c=>c.onclick=()=>{S.sel=c.dataset.d;draw()});$("#ad").onclick=()=>sheetE(null,S.sel);wireItems()}
// --- ИИ
const md=t=>E(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function vAI(){return`<div class="row sp"><h1>ИИ-помощник</h1><div><button class="s" id="hs">🕘</button> <button class="s" id="nc">＋</button></div></div><div id="ml">${S.msgs.length?S.msgs.map(m=>`<div class="m ${m.role==="user"?"u":"a"}">${md(m.content)}</div>`).join(""):`<div class="card mu" style="text-align:center">Спроси про планы, попроси добавить дело или составить расписание.${S.aiOn?"":"<br><b>ИИ сейчас не активен</b>"}</div><div class="seg" style="flex-wrap:wrap">${["Что у меня сегодня?","Составь план на день","Добавь задачу: купить молоко завтра","Что я мог забыть?"].map(t=>`<b data-p="${t}">${t}</b>`).join("")}</div>`}</div>
 <div class="card row" style="position:sticky;bottom:96px"><span id="ph" style="font-size:22px;cursor:pointer">📷</span><span id="mc" style="font-size:22px;cursor:pointer">🎙</span><input id="ai" class="g" placeholder="Сообщение…"><button id="as">➤</button></div><input type="file" id="fi" accept="image/*" hidden>`}
async function send(txt){if(!txt)return;try{if(!S.cid)S.cid=(await api("ai.conversations.create",{title:txt.slice(0,40)})).conversation.id;S.msgs.push({role:"user",content:txt});S.msgs.push({role:"assistant",content:"…"});draw();window.scrollTo(0,1e5);const r=await api("ai.send",{conversation_id:S.cid,message:txt,client:{tz:TZ,today:TD(),time:new Date().toTimeString().slice(0,5)}});S.msgs[S.msgs.length-1]={role:"assistant",content:r.message.content+(r.changes?.length?"\n\n✓ "+r.changes.map(c=>c.title||c.type).join(", "):"")};if(r.changes?.length)loadE();hap("success")}catch(e){S.msgs.pop();fail(e)}draw();window.scrollTo(0,1e5)}
function bAI(){const i=$("#ai");const go=()=>{const t=i.value.trim();i.value="";send(t)};$("#as").onclick=go;i.onkeydown=e=>e.key==="Enter"&&go();document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>send(b.dataset.p));
 $("#nc").onclick=()=>{S.cid=null;S.msgs=[];draw()};$("#hs").onclick=async()=>{try{const L=(await api("ai.conversations.list")).items,s=sheet(`<h1 style="font-size:20px">История</h1>${L.map(c=>`<div class="row card" style="margin:0"><div class="g" data-c="${c.id}">${E(c.title||"Чат")}</div><span data-x="${c.id}">🗑</span></div>`).join("")||'<div class="mu">Пока пусто</div>'}`);s.querySelectorAll("[data-c]").forEach(e=>e.onclick=async()=>{S.cid=e.dataset.c;S.msgs=(await api("ai.messages.list",{conversation_id:S.cid})).items;s.remove();draw()});s.querySelectorAll("[data-x]").forEach(e=>e.onclick=async()=>{await api("ai.conversations.delete",{id:e.dataset.x});if(S.cid===e.dataset.x){S.cid=null;S.msgs=[]}s.remove();draw()})}catch(e){fail(e)}};
 $("#ph").onclick=()=>$("#fi").click();$("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;const im=await createImageBitmap(f),k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);media("photo",cv.toDataURL("image/jpeg",.85).split(",")[1],"image/jpeg")};
 let rec;$("#mc").onclick=async()=>{if(rec){rec.stop();return}try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:rec.mimeType});rec=null;$("#mc").textContent="🎙";const r=new FileReader();r.onload=()=>media("voice",r.result.split(",")[1],b.type.split(";")[0]||"audio/webm");r.readAsDataURL(b)};rec.start();$("#mc").textContent="⏹";toast("Говори… нажми ⏹")}catch{toast("Нет доступа к микрофону")}}}
async function media(kind,data,mime){toast("Разбираю…");try{const r=await api("media.process",{kind,data,mime});if(!r.title){toast("Ничего не нашёл");return}sheetE({kind:r.kind,title:r.title,details:r.details,due_date:r.due_date,due_time:r.due_time,reminder_minutes:r.reminder_minutes})}catch(e){fail(e)}}
// --- память
function vMem(){return`<h1>Память</h1><div class="mu">ИИ учитывает это в ответах</div><div class="card row"><input id="mi" class="g" placeholder="Например: у меня аллергия на орехи"><button id="ma">＋</button></div>${S.mem.map(m=>`<div class="card row"><div class="g">${m.pinned?"📌 ":""}${E(m.content)}</div><span data-p="${m.id}" style="cursor:pointer">${m.pinned?"📍":"📌"}</span><span data-x="${m.id}" style="cursor:pointer">🗑</span></div>`).join("")}`}
function bMem(){$("#ma").onclick=async()=>{const v=$("#mi").value.trim();if(!v)return;try{await api("memories.save",{content:v});S.mem=(await api("memories.list")).items;draw()}catch(e){fail(e)}};document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const m=S.mem.find(x=>x.id===b.dataset.p);await api("memories.pin",{id:m.id,pinned:!m.pinned});S.mem=(await api("memories.list")).items;draw()});document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{await api("memories.delete",{id:b.dataset.x});S.mem=S.mem.filter(x=>x.id!==b.dataset.x);draw()})}
// --- профиль
function vProf(){const p=S.ps,pr=p.premium,u=tg.initDataUnsafe?.user||{},dn=S.E.filter(e=>e.done).length,lv=Math.floor(Math.sqrt(dn/2))+1;
 return`<h1>Профиль</h1><div class="card row"><div style="font-size:34px">${pr?"👑":"🙂"}</div><div class="g"><b>${E(u.first_name||"Гость")}</b><div class="mu">Уровень ${lv} · выполнено ${dn} за 60 дней</div></div></div>
 <div class="card"><div class="row sp"><b>${pr?"Premium активен":"Бесплатный тариф"}</b><span class="mu">${pr?(p.until&&new Date(p.until).getFullYear()<9000?"до "+p.until.slice(0,10):"навсегда"):""}</span></div><div class="bar"><i style="width:${Math.min(100,(p.used_today||0)/(p.limit_today||1)*100)}%"></i></div><div class="mu" style="margin-top:6px">Запросов к ИИ сегодня: ${p.used_today??0} из ${p.limit_today??"–"}</div>${pr?"":`<button id="by" style="margin-top:10px;width:100%">⭐ Premium на ${p.days||30} дн. — ${p.price_stars||100} Stars</button>`}<div class="row" style="margin-top:10px"><input id="pc" class="g" placeholder="Промокод"><button class="s" id="pa">ОК</button></div></div>
 <div class="card"><b>Стиль ИИ</b><div class="seg">${[["brief","Кратко"],["balanced","Обычно"],["detailed","Подробно"]].map(([k,l])=>`<b data-s="${k}" class="${S.st.style===k?"on":""}">${l}</b>`).join("")}</div><textarea id="ci" rows="2" style="margin-top:10px" placeholder="Свои пожелания к ИИ">${E(S.st.custom_instruction||"")}</textarea><button id="si" style="margin-top:10px">Сохранить</button></div>
 <div class="card"><b>Оформление</b><div class="seg">${[["dark","Тёмная"],["light","Светлая"],["auto","Авто"]].map(([k,l])=>`<b data-th="${k}" class="${(localStorage.lvTheme||"dark")===k?"on":""}">${l}</b>`).join("")}</div><div class="sw" style="margin-top:12px">${ACC.map(c=>`<i data-ac="${c}" style="background:${c}" class="${(localStorage.lvAc||ACC[0])===c?"on":""}"></i>`).join("")}</div></div>
 <div class="card"><button class="s" id="sp" style="width:100%">📤 Поделиться планом на сегодня</button></div>`}
function bProf(){const q=(s,f)=>{const e=$(s);if(e)e.onclick=f};q("#by",async()=>{try{tg.openInvoice((await api("premium.invoice")).url,async st=>{if(st==="paid"){hap("success");S.ps=await api("premium.status");draw()}})}catch(e){fail(e)}});
 q("#pa",async()=>{try{await api("premium.redeem",{code:$("#pc").value});boom();S.ps=await api("premium.status");draw()}catch(e){fail(e)}});
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.st.style=b.dataset.s;document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x===b))});
 q("#si",async()=>{try{await api("ai.settings.save",{style:S.st.style,custom_instruction:$("#ci").value,model:"auto"});toast("Сохранено ✓")}catch(e){fail(e)}});
 document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{localStorage.lvTheme=b.dataset.th;th();draw()});document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{localStorage.lvAc=b.dataset.ac;th();draw()});
 q("#sp",()=>{const L=sorted(S.E.filter(e=>e.due_date===TD())),t="📅 Мой план на сегодня:\n"+(L.map(e=>`${e.done?"✅":"☐"} ${e.due_time?e.due_time.slice(0,5)+" ":""}${e.title}`).join("\n")||"пока пусто");tg.openTelegramLink("https://t.me/share/url?url=%20&text="+encodeURIComponent(t))})}
const TABS=[["today","🏠","Сегодня",vToday,bToday],["cal","🗓","Календарь",vCal,bCal],["ai","✨","ИИ",vAI,bAI],["mem","🧠","Память",vMem,bMem],["prof","👤","Профиль",vProf,bProf]];
function draw(){const t=TABS.find(x=>x[0]===S.tab);$("#v").innerHTML=t[3]();t[4]();$("#nav").innerHTML=TABS.map(x=>`<i data-n="${x[0]}" class="${x[0]===S.tab?"on":""}">${x[1]}<small>${x[2]}</small></i>`).join("");document.querySelectorAll("[data-n]").forEach(i=>i.onclick=async()=>{S.tab=i.dataset.n;draw();if(S.tab==="mem"&&!S.mem.length){try{S.mem=(await api("memories.list")).items;draw()}catch(e){fail(e)}}hap("success")})}
(async()=>{if(!API){document.body.innerHTML='<p style="padding:40px;text-align:center">Открой приложение через бота (нужен адрес API).</p>';return}
 draw();await Promise.all([loadE(),api("premium.status").then(r=>S.ps=r).catch(()=>{}),api("ai.settings.get").then(r=>S.st=r).catch(()=>{}),api("ai.hub").then(r=>S.aiOn=r.models.length>0).catch(()=>{})]);draw()})();
</script></body></html>
