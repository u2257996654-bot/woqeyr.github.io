<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>LifeVault</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style id="lifevault-ui">
/* LifeVault UI — графит, индиго и латунь. Мотив: деления сейфовского циферблата (как на экране загрузки). */
:root{
 --bg:#f3f4f9;--card:#ffffff;--card2:#f7f8fd;--text:#10121b;--muted:#6b7288;--line:#e2e5ef;
 --acc:#5b4ef0;--acc2:#7d6fff;--on:#fff;--acct:color-mix(in srgb,var(--acc) 82%,#000);--soft:color-mix(in srgb,var(--acc) 11%,var(--card));
 --brass:#9a6410;--ok:#1f9d68;--danger:#d93f4d;
 --grad:linear-gradient(135deg,var(--acc),var(--acc2));
 --glow:color-mix(in srgb,var(--acc) 18%,transparent);
 --tick:rgba(107,114,136,.45);--tick2:rgba(107,114,136,.7);
 --shadow:0 10px 30px -14px rgba(30,30,80,.22);
 --safe:env(safe-area-inset-bottom,0px);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
[data-theme=dark]{
 --bg:#090b11;--card:#12151e;--card2:#171b27;--text:#eef0f7;--muted:#8a92a8;--line:#222737;
 --acct:color-mix(in srgb,var(--acc2) 72%,#fff);--soft:color-mix(in srgb,var(--acc) 16%,var(--card));
 --brass:#e8b765;--ok:#3ccf91;--danger:#ff6b78;
 --glow:color-mix(in srgb,var(--acc) 26%,transparent);
 --tick:rgba(138,146,168,.38);--tick2:rgba(138,146,168,.62);
 --shadow:0 14px 34px -16px rgba(0,0,0,.7);
}
/* акценты и размер текста (Настройки → Оформление) */
[data-accent=emerald]{--acc:#0e9f6e;--acc2:#34d399}
[data-accent=sky]{--acc:#0a7fc4;--acc2:#38bdf8}
[data-accent=rose]{--acc:#e11d63;--acc2:#fb7185}
[data-accent=amber]{--acc:#d97706;--acc2:#fbbf24}
[data-accent=violet]{--acc:#8b3fe0;--acc2:#c084fc}
[data-accent=graphite]{--acc:#3b4252;--acc2:#7a8499}
[data-size=l] body{font-size:17px}[data-size=l] .dd{font-size:14.5px}[data-size=l] .meta{font-size:13px}[data-size=l] .sec{font-size:13.5px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 2px var(--line);transition:transform .12s,box-shadow .15s}
.sw button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text);transform:scale(1.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden}
body{background:radial-gradient(560px 280px at 50% -90px,var(--glow),transparent 72%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.scroll,#msgs,.sheet,.hub-fallback{scrollbar-width:none}
.scroll::-webkit-scrollbar,#msgs::-webkit-scrollbar,.sheet::-webkit-scrollbar,.hub-fallback::-webkit-scrollbar{display:none}

#app{height:var(--h,100dvh);max-width:700px;margin:0 auto;display:flex;flex-direction:column}

/* шапка: внизу линейка из делений, как на циферблате */
header{position:relative;display:flex;align-items:center;gap:8px;padding:14px 16px 16px;z-index:4}
header::after{content:"";position:absolute;left:16px;right:16px;bottom:2px;height:9px;pointer-events:none;
 background:
  repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 7px) left bottom/100% 4px no-repeat,
  repeating-linear-gradient(90deg,var(--tick2) 0 1.5px,transparent 1.5px 35px) left bottom/100% 9px no-repeat;
 -webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
header h1{flex:1;margin:0;font-size:23px;font-weight:720;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:17px;color:var(--muted);background:var(--card);border:1px solid var(--line);transition:transform .12s,background .15s,color .15s}
.ib:active{transform:scale(.94);background:var(--soft);color:var(--acct)}
.ib[hidden]{display:none}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:6px 14px 100px}

/* нижняя навигация: плавающая капсула, активная вкладка помечена делением */
nav{display:flex;gap:4px;margin:0 12px calc(8px + var(--safe));padding:5px;border:1px solid var(--line);border-radius:22px;
 background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow)}
nav button{position:relative;flex:1;padding:12px 4px 7px;border-radius:17px;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s,color .2s}
nav button span{font-size:18px;line-height:1}
nav button i{font-style:normal}
nav button.on{background:var(--soft);color:var(--acct)}
nav button.on::before{content:"";position:absolute;top:4px;left:50%;width:16px;height:3px;margin-left:-8px;border-radius:3px;background:var(--grad);box-shadow:0 0 10px var(--acc2)}

/* быстрый ввод */
.quick{display:flex;gap:8px;margin:4px 0 6px}
.quick input{flex:1;height:48px;padding:0 16px;border-radius:15px;border:1px solid var(--line);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
.quick input::placeholder,.composer textarea::placeholder,.inp::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
.quick input:focus,.composer textarea:focus,.inp:focus{border-color:var(--acc2);box-shadow:0 0 0 4px var(--glow)}
.quick button{width:48px;height:48px;border-radius:15px;background:var(--grad);color:var(--on);font-size:24px;font-weight:500;box-shadow:0 8px 20px -8px var(--acc);transition:transform .12s}
.quick button:active,.fab:active,.send:active{transform:scale(.94)}

/* списки */
.sec{margin:22px 4px 9px;font-size:12.5px;font-weight:650;color:var(--muted);letter-spacing:.01em}
.sec.warn{color:var(--danger)}
.sec.warn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin:0 7px 1px 0;box-shadow:0 0 8px currentColor}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:flex-start;gap:13px;padding:14px 15px;min-height:56px;cursor:pointer;transition:background .12s}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--soft)}
.chk{flex:none;width:24px;height:24px;margin-top:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 65%,transparent);display:grid;place-items:center;color:transparent;font-size:13px;font-weight:700;transition:background .18s,border-color .18s,box-shadow .18s,color .18s}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.nt{flex:none;width:24px;text-align:center;color:var(--muted)}
.nt.on{color:var(--brass)}
.rt{flex:1;min-width:0}
.tt{overflow-wrap:anywhere;font-weight:560;line-height:1.4}
.dd{margin-top:2px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.meta{flex:none;font-size:12px;font-weight:700;color:var(--brass);background:color-mix(in srgb,var(--brass) 13%,transparent);padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.meta:empty{display:none}
.row.done .tt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted);font-weight:500}
.row.done .meta{opacity:.5}

/* пусто: циферблат из делений вместо иконки */
.empty{text-align:center;color:var(--muted);padding:48px 22px}
.empty::before{content:"";display:block;width:60px;height:60px;margin:0 auto 18px;border-radius:50%;
 background:repeating-conic-gradient(var(--tick2) 0 1.4deg,transparent 1.4deg 6deg);
 -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%)}
.empty b{display:block;color:var(--text);font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}

.btn{display:block;width:100%;padding:14px;border-radius:15px;font-weight:650;text-align:center;margin-top:10px;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--grad);color:var(--on);box-shadow:0 10px 24px -10px var(--acc)}
.btn.sec2{background:var(--soft);color:var(--acct)}
.btn.danger{color:var(--danger);background:none}
.link{color:var(--acct);font-weight:650}

/* чат */
#msgs{flex:1;overflow-y:auto;padding:8px 14px 12px;display:flex;flex-direction:column;gap:9px}
.m{max-width:88%;padding:11px 14px;border-radius:19px;overflow-wrap:anywhere;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.m.u{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap;box-shadow:0 8px 20px -10px var(--acc)}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.m p{margin:0 0 7px}.m p:last-child{margin:0}
.m ul,.m ol{margin:2px 0 7px;padding-left:20px}
.m li+li{margin-top:2px}
.m h4{margin:6px 0 4px;font-size:15px}
.m blockquote{margin:5px 0;padding-left:11px;border-left:3px solid var(--acc2);color:var(--muted)}
.m a{color:var(--acct)}
.m code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:13px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.code{margin:7px 0;border-radius:13px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.code-h{display:flex;justify-content:space-between;padding:6px 11px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.code-h button{color:var(--acct);font-size:12px;font-weight:650}
.code pre{margin:0;padding:9px 12px;overflow-x:auto}.code pre code{background:none;padding:0}
.m.err{align-self:flex-start;background:color-mix(in srgb,var(--danger) 8%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 55%,var(--line))}
.m.err button{display:block;margin-top:7px;color:var(--acct);font-weight:650}
.m.a .mcopy{display:block;margin:6px 0 0 auto;color:var(--muted);font-size:13px;opacity:.7}
.typing{display:inline-flex;gap:5px;padding:5px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--acc2);animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-2px)}}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:20px;text-align:left}
.chip{padding:12px 15px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--text);transition:border-color .15s,background .15s}
.chip:hover,.chip:active{border-color:var(--acc2);background:var(--soft)}
.usage{padding:0 16px 5px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.quick-ai{display:flex;gap:7px;margin:4px 14px 2px;overflow-x:auto;scrollbar-width:none}
.quick-ai::-webkit-scrollbar{display:none}
.ai-action{flex:0 0 auto;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--muted);transition:color .15s,border-color .15s,background .15s}
.ai-action:active{background:var(--soft);color:var(--acct);border-color:var(--acc2)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:7px 14px 10px}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:46px;padding:12px 16px;border-radius:23px;border:1px solid var(--line);background:var(--card);outline:none;line-height:1.4;transition:border-color .15s,box-shadow .15s}
.send{width:46px;height:46px;border-radius:50%;background:var(--grad);color:var(--on);font-size:20px;font-weight:700;flex:none;box-shadow:0 8px 20px -8px var(--acc);transition:transform .12s}
.send:disabled{opacity:.35;box-shadow:none}

/* запись голоса */
.voice-rec{position:fixed;inset:auto 14px 96px 14px;max-width:672px;margin:0 auto;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:none;text-align:center}
.voice-rec.on{display:block}
.voice-rec b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin:0 8px 1px 0;animation:rec 1.2s ease-in-out infinite}
@keyframes rec{50%{opacity:.25;transform:scale(.8)}}
.voice-rec p{font-size:40px;font-weight:200;letter-spacing:-1px;margin:8px 0 4px;font-variant-numeric:tabular-nums}

/* слои */
.scrim{position:fixed;inset:0;background:rgba(4,5,10,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--card);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s cubic-bezier(.3,.8,.3,1);z-index:21;display:flex;flex-direction:column;padding:20px 12px}
.drawer.on{transform:none}
.drawer h3{margin:0 8px 14px;font-size:20px;letter-spacing:-.02em}
.conv{display:flex;align-items:center;border-radius:14px}
.conv.on{background:var(--soft)}
.conv .t{flex:1;min-width:0;text-align:left;padding:11px 12px}
.conv .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:560}
.conv small{color:var(--muted)}
.conv .x{padding:8px 13px;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:12px 18px calc(20px + var(--safe));transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.8,.3,1);z-index:31;max-width:720px;margin:0 auto;box-shadow:0 -18px 50px rgba(0,0,0,.28)}
.sheet.on{transform:none}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.sheet .sub{margin:0 0 12px;color:var(--muted)}
.sheet .hero{padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:var(--card2);margin:8px 0 12px}
.sheet .hero h4{margin:0 0 3px;font-size:16px}.sheet .hero p{margin:0;color:var(--muted);font-size:12.5px}
label.f{display:block;margin:14px 0 7px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}
.two{display:flex;gap:10px}.two>div{flex:1}
.seg{display:flex;gap:4px;padding:4px;border-radius:15px;background:var(--bg);border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:11px;color:var(--muted);font-weight:650;font-size:14px;transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--acct);box-shadow:0 2px 10px -3px rgba(0,0,0,.25),0 0 0 1px var(--line)}

.fab{position:absolute;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--grad);color:var(--on);font-size:28px;font-weight:400;box-shadow:0 12px 28px -8px var(--acc),0 0 0 6px var(--glow);transition:transform .12s}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);padding:11px 18px;border-radius:99px;background:var(--text);color:var(--bg);z-index:50;transition:transform .28s cubic-bezier(.3,.8,.3,1);max-width:90%;font-size:14px;font-weight:550;box-shadow:var(--shadow)}
#toast.on{transform:translate(-50%,0)}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;place-items:center;text-align:center;padding:28px}
#gate.on{display:grid}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc2);border-radius:50%;animation:r .8s linear infinite;margin:18px auto}
@keyframes r{to{transform:rotate(360deg)}}

/* AI HUB */
.ai-hub{padding:12px 18px calc(22px + var(--safe))}
.hub-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hub-title{font-size:24px;font-weight:780;letter-spacing:-.03em}
.hub-sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.hub-close{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--muted);flex:none}
.hub-auto{display:flex;align-items:center;gap:13px;width:100%;padding:15px;border:1px solid color-mix(in srgb,var(--acc2) 70%,var(--line));border-radius:18px;background:linear-gradient(135deg,var(--soft),var(--card));text-align:left;transition:box-shadow .15s}
.ha-icon{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:20px;box-shadow:0 10px 24px -10px var(--acc)}
.hub-auto b{display:block;font-size:15px}.hub-auto span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.hub-section{margin:20px 2px 9px;font-size:12.5px;font-weight:650;color:var(--muted)}
.hub-providers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hub-provider{border:1px solid var(--line);background:var(--card2);border-radius:15px;padding:12px;text-align:left;min-width:0}
.hp-top{display:flex;justify-content:space-between;align-items:center}.hp-icon{font-size:18px}.hp-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5}
.hub-provider.on{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.hub-provider.on .hp-dot{background:var(--ok);opacity:1;box-shadow:0 0 10px var(--ok)}
.hub-provider b{display:block;margin-top:9px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-provider small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.hub-models{display:grid;gap:8px}
.hub-model{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);background:var(--card2);border-radius:15px;text-align:left;width:100%;transition:border-color .15s,background .15s}
.hub-model.active{border-color:var(--acc2);background:var(--soft)}
.hm-icon{width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.hm-main{min-width:0;flex:1}
.hub-model b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-model small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.hm-check{font-size:17px;color:var(--acct);font-weight:700}
.hub-fallback{display:flex;gap:7px;overflow:auto;padding-bottom:2px}
.hub-fb{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:var(--card2);font-size:12px;color:var(--muted)}
.hub-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.hub-actions .btn{margin-top:0}
@media(max-width:430px){.hub-providers{grid-template-columns:1fr 1fr}.hub-provider:last-child{grid-column:1/-1}.m{max-width:92%}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#lvBoot.lv-hidden .lvv,#lvBoot.lv-hidden .lvn{transform:none}}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="lifevault-fx">
/* Слой оформления v2. Идея: день как линейка делений сейфа — прошедшая часть подсвечена, метка «сейчас» ползёт вправо. */
:root{--font:"Onest",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,sans-serif;--bg:#eceef5;--line:#dcdfeb;--shadow:none}
[data-theme=dark]{--bg:#07090f;--card:#0f121a;--card2:#151925;--line:#1f2431;--shadow:none}
body{font-family:var(--font);letter-spacing:-.005em;background:radial-gradient(520px 220px at 50% -80px,var(--glow),transparent 74%),var(--bg)}

/* шапка: крупная дата + линейка дня */
header{padding:18px 18px 24px}
header h1{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
header::after{left:18px;right:18px;bottom:4px;height:10px;
 background:
  repeating-linear-gradient(90deg,var(--acc2) 0 2px,transparent 2px 35px) left bottom/calc(100% * var(--day,.5)) 13px no-repeat,
  repeating-linear-gradient(90deg,var(--acc) 0 1.5px,transparent 1.5px 7px) left bottom/calc(100% * var(--day,.5)) 7px no-repeat,
  repeating-linear-gradient(90deg,var(--tick2) 0 1.5px,transparent 1.5px 35px) left bottom/100% 10px no-repeat,
  repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 7px) left bottom/100% 5px no-repeat}
header::before{content:"";position:absolute;bottom:2px;left:calc(18px + (100% - 36px) * var(--day,.5));width:3px;height:17px;margin-left:-1.5px;border-radius:3px;
 background:var(--grad);box-shadow:0 0 12px var(--acc2),0 0 3px var(--acc2);transition:left 1.2s cubic-bezier(.3,.8,.3,1);z-index:1;pointer-events:none}
.ib{border-radius:14px;width:42px;height:42px}

/* поверхности: тонкая граница вместо одинаковых теней */
.card{border-radius:20px;box-shadow:none;border-color:var(--line)}
.row{padding:15px 16px}
.row:active{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.tt{font-weight:600;letter-spacing:-.01em}
.sec{margin:24px 4px 10px;font-size:13px;font-weight:700;letter-spacing:0;color:var(--muted)}
.sec:not(.warn)::before{content:"";display:inline-block;width:3px;height:11px;border-radius:2px;background:var(--grad);margin:0 8px 0 0;vertical-align:-1px}
.meta{font-weight:700;letter-spacing:.01em}
.chk{width:26px;height:26px}
.quick input{height:52px;border-radius:17px;padding:0 18px}
.quick button{width:52px;height:52px;border-radius:17px}

/* навигация */
nav{border-radius:25px;padding:6px;margin:0 12px calc(10px + var(--safe))}
nav button span{transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
nav button.on span{transform:translateY(-1px) scale(1.14)}
nav button.on{background:color-mix(in srgb,var(--acc) 13%,transparent)}

/* кнопки, чат, шторки */
.btn{border-radius:16px;font-weight:700;letter-spacing:-.005em}
.btn.pri,.quick button,.send,.fab{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 24px -10px var(--acc)}
.fab{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 30px -10px var(--acc),0 0 0 6px var(--glow)}
.m{border-radius:20px}.m.u{border-bottom-right-radius:7px}.m.a{border-bottom-left-radius:7px;border-color:var(--line)}
.composer textarea{border-radius:24px}
.sheet{box-shadow:none;border-radius:30px 30px 0 0;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4)}
.sheet::before{width:44px;background:color-mix(in srgb,var(--muted) 45%,transparent)}
.inp{border-radius:15px}.seg{border-radius:16px}.seg button{border-radius:12px}
.empty b{font-size:19px;letter-spacing:-.02em}
.empty::before{width:72px;height:72px}

.sheet.on{box-shadow:0 -18px 50px rgba(0,0,0,.28)}
/* смена вкладки — одно спокойное появление */
.view.on{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

class ApiError extends Error { constructor(code, status) { super(code); this.code = code; this.status = status; } }
async function api(action, body, timeoutMs) {
  const headers = { 'Content-Type': 'application/json', 'x-telegram-init-data': (tg && tg.initData) || '' };
  if (PUBLIC_KEY) { headers.apikey = PUBLIC_KEY; headers.Authorization = 'Bearer ' + PUBLIC_KEY; }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 35000);
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify({ action, lang: L, ...(body || {}) }), signal: controller.signal, cache: 'no-store' });
  } catch (e) {
    throw new ApiError(e && e.name === 'AbortError' ? 'timeout' : 'network', 0);
  } finally {
    clearTimeout(timer);
  }
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new ApiError(d.error || d.code || 'server_error', r.status);
  return d;
}
function errText(e) {
  const c = e && e.code;
  if (c === 'planner_not_ready') return t('errDb');
  if (c === 'timeout') return t('errTimeout');
  if (c === 'invalid_promo') return t('invalidPromo');
  if (c === 'promo_not_ready') return t('promoNotReady');
  if (c === 'network') return t('errNet');
  if (c === 'unauthorized') return t('errAuth');
  if (c === 'rate_limited') return t('errRate');
  if (c === 'ai_unavailable') return t('errAi');
  if (c === 'ai_quota') return t('errAiQuota');
  if (c === 'ai_key') return t('errAiKey');
  if (c === 'ai_nokey') return t('errAiNoKey');
  return t('errGen') + (c && c !== 'server_error' ? ' (' + c + ')' : '');
}

// ---------- Markdown (HTML экранируется заранее) ----------
function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => { blocks.push({ lang, code: code.replace(/\n$/, '') }); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const line of s.split('\n')) {
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + m[1] + '</li>'); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + m[1] + '</li>'); continue; }
    close();
    if (/^\u0000\d+\u0000$/.test(line.trim())) out.push(line.trim());
    else if ((m = line.match(/^#{1,6}\s+(.*)/))) out.push('<h4>' + m[1] + '</h4>');
    else if ((m = line.match(/^&gt;\s?(.*)/))) out.push('<blockquote>' + m[1] + '</blockquote>');
    else if (line.trim()) out.push('<p>' + line + '</p>');
  }
  close();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => { const b = blocks[+i]; return '<div class="code"><div class="code-h"><span>' + (b.lang || 'code') + '</span><button data-copy>' + t('copy') + '</button></div><pre><code>' + b.code + '</code></pre></div>'; });
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-copy]'); if (!btn) return;
  const code = btn.closest('.code').querySelector('code').textContent;
  const done = () => { btn.textContent = t('copied'); setTimeout(() => (btn.textContent = t('copy')), 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done);
  else { const ta = document.createElement('textarea'); ta.value = code; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); done(); }
});

async function send(text, opts) {

    if (!S.cur) { const c = (await api('ai.conversations.create', { title: text.replace(/\s+/g, ' ').slice(0, 60) })).conversation; S.cur = c.id; S.title = c.title; renderHeader(); }
    const r = await api('ai.send', isRetry ? { conversation_id: S.cur, retry: true, client } : { conversation_id: S.cur, message: text, client }, 30000);
    S.msgs.push(r.message); loadConvs(); loadStatus();

// ---------- Голос / фото: распознаём и открываем готовую запись на подтверждение ----------
function readB64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }

// Gemini надёжно понимает WAV, а MediaRecorder даёт webm/mp4 — перекодируем в WAV 16 кГц моно.
async function toWav(blob) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const audio = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close && ctx.close();
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration * 16000)), 16000);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); dv.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([dv], { type: 'audio/wav' });
}
async function shrinkImage(file, max) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return { mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] };
  } catch (e) { return { mime: file.type || 'image/jpeg', data: await readB64(file) }; }
}
// Видео: берём 4 кадра из разных мест ролика и склеиваем в одну картинку 2×2 — её обрабатывает тот же media.process, что и фото.
async function videoSheet(file) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  const wait = (ev, ms) => new Promise((res, rej) => { const to = setTimeout(() => rej(new Error('video_timeout')), ms); v.addEventListener(ev, () => { clearTimeout(to); res(); }, { once: true }); v.addEventListener('error', () => { clearTimeout(to); rej(new Error('video_error')); }, { once: true }); });
  try {
    await wait('loadeddata', 15000);
    const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 1;
    const W = 640, H = Math.round(W * ((v.videoHeight || 9) / (v.videoWidth || 16)));
    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
    const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
    const marks = [0.05, 0.35, 0.65, 0.92];
    for (let i = 0; i < marks.length; i++) {
      const seeked = wait('seeked', 8000); v.currentTime = Math.min(dur - 0.05, dur * marks[i]); if (dur > 0.2) await seeked.catch(() => {});
      x.drawImage(v, (i % 2) * W, Math.floor(i / 2) * H, W, H);
    }
    return { mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.8).split(',')[1] };
  } finally { URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); }
}
function applyMedia(r, failKey) {
  if (r && r.title) {
    openEntry(null, null, { kind: 'event', title: String(r.title), details: r.details || '', due_date: r.due_date || todayStr(), due_time: r.due_time || '', reminder_minutes: r.reminder_minutes == null ? null : Number(r.reminder_minutes) });
    haptic('success');
  } else toast(t(failKey));
}
let rec = null;
function stopTimers() { clearInterval(rec && rec.timer); clearTimeout(rec && rec.limit); }
$('btnVoice').onclick = async () => {
  if (rec) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast(t('micDenied')); return; }
  const mr = new MediaRecorder(stream); const chunks = [];
  rec = { mr, cancelled: false, started: Date.now() };
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach((x) => x.stop()); stopTimers(); $('voiceRec').classList.remove('on');
    const cancelled = rec.cancelled; rec = null;
    if (cancelled || !chunks.length) return;
    toast(t('recognizing'));
    try {
      let blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      try { blob = await toWav(blob); } catch (e) { /* отправим как есть */ }
      applyMedia(await api('media.process', { kind: 'voice', mime: blob.type || 'audio/webm', data: await readB64(blob) }, 60000), 'voiceFail');
    } catch (e) { toast(errText(e)); }
  };
  mr.start(); $('voiceRec').classList.add('on'); $('voiceTimer').textContent = '00:00';
  rec.timer = setInterval(() => { const s = Math.floor((Date.now() - rec.started) / 1000); $('voiceTimer').textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); }, 500);
  rec.limit = setTimeout(() => { if (rec && rec.mr.state !== 'inactive') rec.mr.stop(); }, 60000); // не длиннее минуты
};
$('stopVoice').onclick = () => { if (rec && rec.mr.state !== 'inactive') rec.mr.stop(); };
$('cancelVoice').onclick = () => { if (rec) { rec.cancelled = true; if (rec.mr.state !== 'inactive') rec.mr.stop(); } };
$('btnPhoto').onclick = () => $('photoInput').click();

<script>
// Экран загрузки: циферблат-сейф. Деления загораются по реальному прогрессу, в центре сегодняшняя дата.
(() => {

  const LABELS = ru ? ['Открываю сейф', 'Загружаю ваш день', 'Готово'] : ['Opening the vault', 'Loading your day', 'Ready'];

  const st = $('lvBootStatus'), bar = boot.querySelector('.lvbar i'), t0 = Date.now();
  let cur = 0, target = 0, label = 0, finished = false, closing = false;
  const setLabel = (i) => { if (i !== label || !st.textContent) { label = i; st.textContent = LABELS[i]; st.style.animation = 'none'; void st.offsetWidth; st.style.animation = ''; } };

    setTimeout(() => { boot.classList.add('lv-hidden'); setTimeout(() => boot.remove(), 900); }, 850);
  }
  window.lvBoot = { stage(p, i) { target = Math.max(target, p); setLabel(i); }, done() { finished = true; } };
  const gate = $('gate');
  if (gate && gate.classList.contains('on') && $('gateSpin').style.display === 'none') finished = true; // ошибка уже показана
  setTimeout(() => { finished = true; }, 9000);           // страховка: экран не должен висеть вечно
  requestAnimationFrame(frame);
})();

/* ============ Серия и награды ============ */
const active = (d) => (S.food[d] || []).length || S.tx.some((t) => t.d === d) || (S.h[d] && (S.h[d].w || S.h[d].s || S.h[d].z)) || (S.hl[d] || []).length || S.wt.some((w) => w.d === d);

/* ============ Компоненты ============ */
function ring(p, sz, w, col, inner) {

<script>
// Анимации интерфейса: каскад списков, индикатор вкладок, рябь, конфетти и вибро-отклик
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const tg = window.Telegram && Telegram.WebApp, hap = (t) => { try { tg.HapticFeedback[t === 's' ? 'selectionChanged' : 'impactOccurred']('light'); } catch (e) {} };
  // 1) Каскад: каждому новому элементу списка — своя задержка
  const SEL = '.row,.card,.conv,.sec2';
  const stagger = (root) => { let i = 0; (root.matches && root.matches(SEL) ? [root] : []).concat([...root.querySelectorAll ? root.querySelectorAll(SEL) : []]).forEach((el) => { if (!el.dataset.lvi) { el.dataset.lvi = 1; el.style.setProperty('--i', Math.min(i++, 12)); } }); };
  new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((n) => n.nodeType === 1 && stagger(n)))).observe(document.body, { childList: true, subtree: true });
  // 2) Бегущий индикатор активной вкладки
  const nav = document.querySelector('nav'); if (nav) {
    const ind = document.createElement('i'); ind.id = 'lvInd'; nav.appendChild(ind);
    const pill = document.createElement('i'); pill.id = 'lvPill'; nav.insertBefore(pill, nav.firstChild);
    const move = () => { const b = nav.querySelector('button.on'); if (b) { pill.style.cssText = `left:${b.offsetLeft}px;top:${b.offsetTop}px;width:${b.offsetWidth}px;height:${b.offsetHeight}px`; ind.style.left = b.offsetLeft + b.offsetWidth * .25 + 'px'; ind.style.width = b.offsetWidth * .5 + 'px'; } };
    new MutationObserver(move).observe(nav, { attributes: true, subtree: true, attributeFilter: ['class'] }); addEventListener('resize', move); setTimeout(move, 600); setTimeout(move, 1800);
    nav.addEventListener('click', () => hap('s'));
  }
  // 3) Рябь на кнопках
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest && e.target.closest('button:not(.chk):not(.fab):not(.send),.ib'); if (!b) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), p = document.createElement('i');
    if (getComputedStyle(b).position === 'static') b.style.position = 'relative'; b.style.overflow = b.style.overflow || 'hidden';
    p.className = 'lvRip'; p.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`; b.appendChild(p); setTimeout(() => p.remove(), 650); hap('i');
  }, { passive: true });
  // 4) Конфетти при выполнении дела
  const burst = (x, y) => {
    const cols = ['#6ee7a8', '#6aa7ff', '#ffd166', '#ff7aa2', '#b794ff'];
    for (let k = 0; k < 16; k++) {
      const c = document.createElement('i'); c.className = 'lvConf'; c.style.cssText = `left:${x}px;top:${y}px;background:${cols[k % 5]}`; document.body.appendChild(c);
      const a = Math.PI * 2 * k / 16 + Math.random() * .4, v = 50 + Math.random() * 70;
      c.animate([{ transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * v}px,${Math.sin(a) * v + 40}px) rotate(${Math.random() * 540}deg) scale(.3)`, opacity: 0 }], { duration: 750 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => c.remove();
    }
  };
  document.addEventListener('click', (e) => {
    const c = e.target.closest && e.target.closest('.chk'); if (!c) return;
    const row = c.closest('.row'), was = c.getAttribute('aria-pressed') === 'true' || c.classList.contains('on') || (row && row.classList.contains('done'));
    if (!was) { const r = c.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); try { tg.HapticFeedback.notificationOccurred('success'); } catch (x) {} }
  }, true);
  // 5) Фон-аврора и тень шапки при прокрутке
  const aur = document.createElement('div'); aur.className = 'lvAur'; aur.innerHTML = '<i></i><i></i>'; document.body.prepend(aur);
  const hd = document.querySelector('header');
  document.addEventListener('scroll', (e) => { const t = e.target; if (hd && t.classList && t.classList.contains('scroll')) hd.classList.toggle('lvScr', t.scrollTop > 6); }, true);
  const ht = document.getElementById('hTitle'); if (ht) new MutationObserver(() => { ht.classList.remove('lvT'); void ht.offsetWidth; ht.classList.add('lvT'); }).observe(ht, { childList: true, characterData: true, subtree: true });
  stagger(document.body);
})();
</script>
